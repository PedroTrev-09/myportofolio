<button type="button" 
        class="contact-link ghost" 
        popovertarget="delete-project-{{ project.id }}" 
        style="padding: 0.3rem 0.8rem; font-size: 0.75rem; border-color: #b42318; color: #b42318; margin-top: 1rem; position: relative; z-index: 5;">
    Hapus Proyek
</button>

<div id="delete-project-{{ project.id }}" 
     class="project-delete-modal" 
     popover="auto" 
     role="dialog" 
     aria-modal="true" 
     aria-labelledby="delete-project-title-{{ project.id }}">
     
    <button type="button" 
            class="project-delete-modal_backdrop" 
            popovertarget="delete-project-{{ project.id }}" 
            popovertargetaction="hide" 
            aria-label="Tutup konfirmasi hapus"></button>
            
    <div class="project-delete-modal_content" style="background: var(--bg); color: var(--ink);">
        <button type="button" 
                class="project-delete-modal_close" 
                popovertarget="delete-project-{{ project.id }}" 
                popovertargetaction="hide" 
                aria-label="Tutup konfirmasi hapus">&times;</button>
                
        <h2 id="delete-project-title-{{ project.id }}" style="color: var(--heading);">Hapus Proyek?</h2>
        <p>Apakah Anda yakin ingin menghapus <strong>{{ project.title }}</strong>?</p>
        
        <div class="project-delete-modal_actions">
            <button type="button" 
                    class="contact-link ghost" 
                    popovertarget="delete-project-{{ project.id }}" 
                    popovertargetaction="hide">Batal</button>
            <form method="post" action="{% url 'main:delete_project' project.id %}">
                {% csrf_token %}
                <button type="submit" class="contact-link primary" style="background: #b42318; border-color: #b42318;">Ya, Hapus</button>
            </form>
        </div>
    </div>
</div>
