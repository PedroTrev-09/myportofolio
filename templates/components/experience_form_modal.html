<dialog
    id="add-experience-modal"
    class="project-form-modal"
    aria-labelledby="add-experience-modal-title"
>
    <button
        type="button"
        class="project-form-modal__backdrop"
        data-dialog-close
        aria-label="Tutup form tambah pengalaman"
    ></button>

    <div class="project-form-modal__content">
        <button
            type="button"
            class="project-form-modal__close"
            data-dialog-close
            aria-label="Tutup form tambah pengalaman"
        >×</button>

        <h2 id="add-experience-modal-title">Tambah Pengalaman Baru</h2>

        <form
            id="experience-form"
            method="post"
            action="{% url 'api:experience-list' %}"
            class="project-form"
        >
            {% csrf_token %}
            <p class="form-feedback" data-form-feedback role="alert" tabindex="-1" hidden></p>

            <div class="experience-form-fields">
            {% for field in form %}
                <div class="form-group form-group--{{ field.name }}">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                </div>
            {% endfor %}
            </div>

            <div class="project-form-modal__actions">
                <button
                    type="button"
                    class="button button-secondary"
                    data-dialog-close
                >
                    Batal
                </button>
                <button type="submit" class="button">Tambah Pengalaman</button>
            </div>
        </form>
    </div>
</dialog>
