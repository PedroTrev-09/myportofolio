<dialog id="project-detail-modal" class="project-form-modal" aria-labelledby="project-detail-title">
    <button type="button" class="project-form-modal__backdrop" data-dialog-close aria-label="Close project details"></button>
    <div class="project-form-modal__content">
        <button type="button" class="project-form-modal__close" data-dialog-close aria-label="Close project details">&times;</button>
        <img id="project-detail-image" class="project-img" alt="" hidden>
        <h2 id="project-detail-title"></h2>
        <p id="project-detail-description"></p>
    </div>
</dialog>
