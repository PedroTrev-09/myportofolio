<dialog id="delete-confirmation" class="project-delete-modal" aria-labelledby="delete-confirmation-title">
    <button type="button" class="project-delete-modal_backdrop" data-dialog-close aria-label="Close confirmation"></button>
    <div class="project-delete-modal_content">
        <button type="button" class="project-delete-modal_close" data-dialog-close aria-label="Close confirmation">&times;</button>
        <h2 id="delete-confirmation-title">Delete item?</h2>
        <p>Are you sure you want to delete <strong></strong>?</p>
        <div class="project-delete-modal_actions">
            <button type="button" class="button button-secondary" data-dialog-close>Cancel</button>
            <form method="post">{% csrf_token %}<button type="submit" class="btn-danger-fill">Yes, delete</button></form>
        </div>
    </div>
</dialog>
