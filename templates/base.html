{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#E98B50">
    <meta name="description" content="Portfolio of {{ name|default:'Haikal Rafka' }} — Information Systems student at Universitas Indonesia.">
    
    {% block meta %}
    {% endblock meta %}
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body id="top">

    <a href="#main-content" class="visually-hidden skip-link">Skip to content</a>

    <input type="checkbox" id="theme-toggle" class="visually-hidden">
    <input type="checkbox" id="nav-toggle" class="visually-hidden">

    <header class="site-header">
        <div class="container header-inner">
            <a href="#top" class="brand">{{ headerName }}</a>

            <nav class="site-nav" aria-label="Primary">
                <a href="{% url 'main:show_main' %}#about">About</a>
                <a href="{% url 'main:show_main' %}#skills">Skills</a>
                <a href="{% url 'main:show_experience' %}">Experience</a>
                <a href="{% url 'main:show_project' %}">Projects</a>
                <a href="{% url 'main:show_main' %}#contact">Contact</a>
            </nav>

            <div class="header-actions">
                <label for="theme-toggle" class="theme-switch" aria-label="Switch between day and night theme">
                    <span class="theme-switch-track"><span class="theme-switch-thumb"></span></span>
                </label>
                <label for="nav-toggle" class="hamburger" aria-label="Open menu">
                    <span></span><span></span><span></span>
                </label>
            </div>
        </div>
    </header>

    {% block content %}
    {% endblock content %}

    <footer class="site-footer">
        <div class="container footer-inner">
            <p>&copy; 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
            <a href="#top" class="back-to-top">Back to top</a>
        </div>
    </footer>

</body>
</html>
